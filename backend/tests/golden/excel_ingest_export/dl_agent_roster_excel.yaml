      temporary: discovery05  # staging dataset (every file is loaded here first)
      target: marketing01  # dataset of the history and target tables
    ftp:
      bucket: value-gcp-ftp  # change accordingly
      path: outbound/agent_roster  # change accordingly ('' = the bucket root)
      file_name: active_agents_  # a date suffix and the extension are added by the script
