# Configuration for GCP projects
gcp_projects:
  lab:
    # Configuration for the 'lab' (dev) project
    read_project: demo-analytics-dev  # project the SQL reads from
    write_project: demo-analytics-dev  # project the process writes to
    data_sets:
      target_dataset: clubwide
    write_disposition: WRITE_APPEND
    gcs_config:
      gcs_read_bucket: demo_file_test_bucket  # change accordingly
      gcs_read_bucket_path: agent_roster  # change accordingly
      gcs_archive_bucket: demo_file_test_bucket  # processed files are moved here
      gcs_archive_bucket_path: agent_roster/Archive
      filename: Agent_Roster_  # files whose name contains this text are loaded
      sheet_name: Roster  # Excel sheet to read ('' = the first one)
      header: '0'  # pandas header row ('None' = no header row)
      skiprows: '2'  # pandas skiprows ('None', '1' or '[0, 2]')
    datasets:
      temporary: clubwide  # staging dataset (every file is loaded here first)
      target: clubwide  # dataset of the history and target tables
    ftp:
      bucket: demo_file_test_bucket  # change accordingly
      path: outbound/agent_roster  # change accordingly ('' = the bucket root)
      file_name: active_agents_  # a date suffix and the extension are added by the script
    ftp_full:
      bucket: demo_file_test_bucket  # change accordingly
      path: outbound/agent_roster/full  # change accordingly ('' = the bucket root)
      file_name: agent_roster_  # a date suffix and the extension are added by the script
    email:
      sender: pipeline.developer@example.com  # the ADC identity's email
      receiver:  # recipients
        - marketing-dev@acme.example.com
      attachment: []

  value:
    # Configuration for the 'value' (prod) project
    read_project: value-gcp  # project the SQL reads from
    write_project: value-gcp  # project the process writes to
    data_sets:
      target_dataset: marketing01
    write_disposition: WRITE_APPEND
    gcs_config:
      gcs_read_bucket: value-gcp-insights  # change accordingly
      gcs_read_bucket_path: inbound/agent_roster  # change accordingly
      gcs_archive_bucket: value-gcp-insights  # processed files are moved here
      gcs_archive_bucket_path: Archive/inbound/agent_roster
      filename: Agent_Roster_  # files whose name contains this text are loaded
      sheet_name: Roster  # Excel sheet to read ('' = the first one)
      header: '0'  # pandas header row ('None' = no header row)
      skiprows: '2'  # pandas skiprows ('None', '1' or '[0, 2]')
