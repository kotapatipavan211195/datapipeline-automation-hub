      sources:  # gs:// or local paths; {date:%Y%m%d} = today
        - gs://demo_vendor_drop_test/outbound/Daily Engagement File_*.csv
      destination: gs://demo_file_test_bucket/engagement_ingestion/  # gs:// or local folder
    email:
      sender: pipeline.developer@example.com  # the ADC identity's email
      receiver:  # recipients
        - pipeline.developer@example.com
      attachment: []

  value:
    # Configuration for the 'value' (prod) project
