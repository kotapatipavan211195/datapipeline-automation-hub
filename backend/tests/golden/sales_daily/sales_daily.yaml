      gcs_read_bucket: acme-landing-dev  # change accordingly
      gcs_read_bucket_path: sales/incoming  # change accordingly
      gcs_archive_bucket: acme-landing-dev  # processed files are moved here
      gcs_archive_bucket_path: sales/archive
