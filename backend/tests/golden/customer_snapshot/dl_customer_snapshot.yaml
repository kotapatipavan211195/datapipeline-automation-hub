# customer_snapshot: configuration for dl_customer_snapshot.py
# Run:  py ./dl_customer_snapshot.py -cf ./dl_customer_snapshot.yaml -ts ./dl_customer_snapshot_table_schema.yaml <environment>   (environment: lab | value)
# Generated by Datapipeline Automation Hub 3.4.0 on 2026-01-01 (spec 07c8d16e908c).
# ADC identity at generation: pipeline.developer@example.com

# Configuration for GCP projects
gcp_projects:
  lab:
    # Configuration for the 'lab' (dev) project
    read_project: acme-analytics-dev  # project the SQL reads from
    write_project: acme-analytics-dev  # project the process writes to
    data_sets:
      crm_dataset: crm
    write_disposition: WRITE_APPEND
    gcs_config:
      gcs_read_bucket: acme-crm-dropzone  # change accordingly
      gcs_read_bucket_path: exports/customers  # change accordingly
      gcs_archive_bucket: acme-crm-dropzone  # processed files are moved here
      gcs_archive_bucket_path: archive
      filename: customers_  # files whose name contains this text are loaded
      header: '0'  # pandas header row ('None' = no header row)
      skiprows: None  # pandas skiprows ('None', '1' or '[0, 2]')
      separator: '|'
    datasets:
      temporary: crm  # staging dataset (every file is loaded here first)
      target: crm  # dataset of the history and target tables
    ftp:
      bucket: acme-crm-dropzone  # change accordingly
      path: snapshots/dim_customer  # change accordingly ('' = the bucket root)
      file_name: dim_customer_  # a date suffix and the extension are added by the script
    ftp_contacts:
      bucket: acme-crm-dropzone  # change accordingly
      path: outbound/contacts  # change accordingly ('' = the bucket root)
      file_name: customer_contacts_  # a date suffix and the extension are added by the script
    file_copy:
      sources:  # gs:// or local paths; {date:%Y%m%d} = today
        - gs://acme-crm-dropzone/outbound/contacts/customer_contacts_{date:%Y_%m_%d}-*.txt
      destination: /data/outbound/vendor_share/  # gs:// or local folder

  value:
    # Configuration for the 'value' (prod) project
    read_project: acme-analytics-prod  # project the SQL reads from
    write_project: acme-analytics-prod  # project the process writes to
    data_sets:
      crm_dataset: crm
    write_disposition: WRITE_APPEND
    gcs_config:
      gcs_read_bucket: acme-crm-dropzone-prod  # change accordingly
      gcs_read_bucket_path: exports/customers  # change accordingly
      gcs_archive_bucket: acme-crm-dropzone-prod  # processed files are moved here
      gcs_archive_bucket_path: archive
      filename: customers_  # files whose name contains this text are loaded
      header: '0'  # pandas header row ('None' = no header row)
      skiprows: None  # pandas skiprows ('None', '1' or '[0, 2]')
      separator: '|'
    datasets:
      temporary: crm  # staging dataset (every file is loaded here first)
      target: crm  # dataset of the history and target tables
    ftp:
      bucket: acme-crm-dropzone-prod  # change accordingly
      path: snapshots/dim_customer  # change accordingly ('' = the bucket root)
      file_name: dim_customer_  # a date suffix and the extension are added by the script
    ftp_contacts:
      bucket: acme-crm-dropzone-prod  # change accordingly
      path: outbound/contacts  # change accordingly ('' = the bucket root)
      file_name: customer_contacts_  # a date suffix and the extension are added by the script
    file_copy:
      sources:  # gs:// or local paths; {date:%Y%m%d} = today
        - gs://acme-crm-dropzone-prod/outbound/contacts/customer_contacts_{date:%Y_%m_%d}-*.txt
      destination: /data/outbound/vendor_share/  # gs:// or local folder
